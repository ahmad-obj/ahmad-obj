<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ahmad.obj</title>
  <desc id="desc">A dark technical banner for Muhammad Ahmad, focused on AI systems, automation, computer vision, and C++.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="0.58" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#07101D"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="42%" r="55%">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".28"/>
      <stop offset=".48" stop-color="#2563EB" stop-opacity=".07"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
