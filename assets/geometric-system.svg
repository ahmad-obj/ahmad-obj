  @keyframes dash{to{stroke-dashoffset:-176}}@keyframes dash2{to{stroke-dashoffset:155}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}
  @keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes float3{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
