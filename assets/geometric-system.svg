  .node1{animation:node 3s ease-in-out infinite}.node2{animation:node 3s 1s ease-in-out infinite}.node3{animation:node 3s 2s ease-in-out infinite}
  .label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.8px}.title{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700;letter-spacing:7px}
