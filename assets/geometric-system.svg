  @keyframes dash { to { stroke-dashoffset: -160; } }
  @keyframes dashReverse { to { stroke-dashoffset: 170; } }
  .dash { animation: dash 4s linear infinite; }
  .dashr { animation: dashReverse 6s linear infinite; }
</style>

