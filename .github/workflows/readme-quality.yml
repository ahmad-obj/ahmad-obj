name: README Quality

on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "tools/readme_*/**"
      - "tests/test_readme_*.py"
      - ".github/workflows/readme-quality.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "tools/readme_*/**"
      - "tests/test_readme_*.py"
      - ".github/workflows/readme-quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -v
