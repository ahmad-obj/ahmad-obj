name: Render The Loom

on:
  push:
    branches:
      - feature/the-loom-v1
    paths:
      - "tools/loom/**"
      - "tests/test_loom_*.py"
      - ".github/workflows/render-loom.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/the-loom-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/loom/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Loom tests
        run: python -m unittest discover -s tests -p "test_loom_*.py" -v

      - name: Render production artwork
        run: python -m tools.loom --output assets/loom.gif --poster assets/loom-poster.png

      - name: Verify production asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          p = Path("assets/loom.gif")
          with Image.open(p) as gif:
              assert gif.size == (1200, 430)
              assert gif.n_frames == 216
              assert gif.info.get("loop") == 0
          assert p.stat().st_size <= 10 * 1024 * 1024
          print("bytes", p.stat().st_size)
          print("sha256", hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/loom.gif assets/loom-poster.png
          if git diff --cached --quiet; then
            echo "Rendered assets already current."
          else
            git commit -m "build: render The Loom assets [skip ci]"
            git push origin HEAD:feature/the-loom-v1
          fi
