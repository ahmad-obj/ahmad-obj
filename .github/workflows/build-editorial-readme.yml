name: Build Editorial README

on:
  push:
    branches: [feature/editorial-readme-v2]
    paths:
      - "tools/readme_v2/**"
      - "tests/test_readme_v2.py"
      - "README.md"
      - ".github/workflows/build-editorial-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editorial-readme-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate panels
        run: python tools/readme_v2/generate.py
      - name: Verify
        run: python -m unittest tests.test_readme_v2 -v
      - name: Commit panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/editorial/*.svg
          if git diff --cached --quiet; then
            echo "Panels already current."
          else
            git commit -m "build: generate editorial README panels [skip ci]"
            git push origin HEAD:feature/editorial-readme-v2
          fi
