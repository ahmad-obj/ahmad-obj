name: Verify README v3

on:
  push:
    branches: [feature/editorial-readme-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/editorial-readme-v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -v
